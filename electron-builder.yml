publish:
  provider: github
  owner: Shoaib-Akh
  repo: pnutdownloader

win:
  target: nsis
  icon: public/icon.ico
  signing: false

linux:
  target: AppImage
  icon: resources/icon.png

mac:
  target: dmg
  icon: resources/icon.icns

extraResources:
  - from: public/yt-dlp.exe
    to: yt-dlp.exe
  
  - from: public/yt-dlp_macos
    to: yt-dlp_macos
 
  - from: public/ffmpeg.exe
    to: ffmpeg.exe
    
  - from: public/ffmpeg
    to: ffmpeg

  - from: public/cookies.txt
    to: cookies.txt
    
  - from: public/all.json
    to: all.json
    
  - from: public/formats.json
    to: formats.json