publish:
  provider: github
  owner: Shoaib-Akh
  repo: pnutdownloader

win:
  target: nsis
  icon: public/icon.ico
  signing: false

linux:
  target: AppImage
  icon: resources/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
        - universal
  icon: resources/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false

extraResources:
  - from: public/yt-dlp.exe
    to: yt-dlp.exe
  
  - from: public/yt-dlp_macos
    to: yt-dlp_macos

  - from: public/yt-dlp
    to: yt-dlp
 
  - from: public/ffmpeg.exe
    to: ffmpeg.exe
    
  - from: public/ffmpeg
    to: ffmpeg

  - from: public/cookies.txt
    to: cookies.txt
    
  - from: public/all.json
    to: all.json
    
  - from: public/formats.json
    to: formats.json
    
  - from: public/ytdlp_version.txt
    to: ytdlp_version.txt
